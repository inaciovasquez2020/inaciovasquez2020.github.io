name: verify

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run site verification
        run: python3 scripts/verify_site.py
      - name: Check public navigation and local links
        run: python3 tests/test_public_navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check analytics loader syntax and privacy guards
        run: |
          node --check analytics-config.js
          node --check analytics.js
          node tests/test_analytics.js

      - name: Math Lab exact arithmetic, manifest and categorization tests
        run: |
          node --test math-lab/test_*.mjs
          python3 tests/test_math_lab_navigation.py
          python3 -m py_compile math-lab/replay_casebook.py
