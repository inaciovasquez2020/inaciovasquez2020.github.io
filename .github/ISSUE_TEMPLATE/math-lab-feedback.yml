name: "Math Lab: suggestion or inquiry"
description: "Suggest a feature, ask a question, or report a reproducible problem."
title: "[Math Lab] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Math Verification Lab.
        This issue will be public on GitHub. Do not include confidential or unpublished
        manuscripts, full proofs, credentials, personal information, or other sensitive data.
        Suggestions and questions are not proof verification results.
  - type: dropdown
    id: request-kind
    attributes:
      label: Type of inquiry
      options:
        - "Feature or workflow suggestion"
        - "Question about using the Lab"
        - "Reproducible defect"
        - "New verification method or research domain"
        - "Translation or accessibility"
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Suggestion or question
      description: "What problem are you trying to solve, or what behavior should change?"
      placeholder: "Describe the request without confidential manuscript text."
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected behavior or reproduction (optional)
      description: "Provide a short public example and expected outcome when helpful."
    validations:
      required: false
  - type: input
    id: public-reference
    attributes:
      label: Public reference link (optional)
      description: "Use only a link to material you can share publicly."
      placeholder: "https://"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission acknowledgment
      options:
        - label: "I understand this issue is public and contains no private manuscripts, proofs, credentials, or personal data."
          required: true
